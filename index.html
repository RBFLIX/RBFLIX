<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RB FLIX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23090a0f'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='30' font-weight='800' text-anchor='middle' fill='%23e50914'%3ERB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap">
<style>
:root{--bg:#090a0f;--panel:#151620;--muted:#a4a5b0;--text:#f7f7fb;--red:#e50914;--line:#2a2c36;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid #ff525b;outline-offset:2px}
.wrap{max-width:1280px;margin:auto;padding:0 5%}
.top{min-height:72px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;gap:24px;position:sticky;top:0;background:#090a0ff2;backdrop-filter:blur(12px);z-index:5;padding:0 5%}
.logo{font:800 25px Manrope,sans-serif;letter-spacing:-1px}.logo b{color:var(--red)}
nav{display:flex;gap:22px;font-size:14px}nav a{color:#bbb;padding:6px 0}nav a.on{color:#fff;box-shadow:0 2px 0 var(--red)}
#auth{margin-left:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:7px;padding:11px 16px;font-weight:700;display:inline-block;color:#fff;background:#292a34}
.btn.primary{background:var(--red)}.btn.sm{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.6;cursor:default}
.hero{min-height:400px;padding:60px 7%;display:flex;align-items:center;background:radial-gradient(ellipse at 80% 30%,#5b285f 0,transparent 35%),linear-gradient(90deg,#090a0f,#171322 65%,#10111a)}
.hero h1{font:800 clamp(36px,5vw,60px)/1.05 Manrope,sans-serif;margin:0 0 14px;max-width:560px}
.hero p{color:#c4c4ce;line-height:1.7;max-width:540px}
.section{padding:36px 0}h2{font:800 24px Manrope,sans-serif;margin:0 0 16px}.page{padding:36px 0 60px}.page h1,.detail h1{font:800 clamp(28px,4vw,42px)/1.1 Manrope,sans-serif;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.card{min-width:0;display:block}
.poster{aspect-ratio:2/2.85;border-radius:9px;padding:14px;display:flex;align-items:end;position:relative;overflow:hidden}
.poster:before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#05060c,transparent 75%)}
.poster strong{position:relative;font:800 19px Manrope,sans-serif;line-height:1.15}
.card p{font-size:12px;color:#aaa;margin:8px 0 0}
.filters{display:flex;gap:10px;margin:0 0 22px;flex-wrap:wrap}
.field,.form input,.form select,.form textarea{background:#171821;border:1px solid #363844;color:#fff;padding:11px 12px;border-radius:7px;width:auto}
.pager{display:flex;justify-content:space-between;align-items:center;margin:26px 0}
.muted{color:var(--muted)}
.premium{padding:26px;border:1px solid #61303b;border-radius:12px;background:linear-gradient(110deg,#17121a,#341722);margin:30px 0 50px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.detail{display:grid;grid-template-columns:minmax(0,270px) 1fr;gap:34px;align-items:start}
.detail p{line-height:1.7;color:#c4c4ce;max-width:62ch}
.form{max-width:460px;margin:40px auto;padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.form.wide{max-width:560px;margin:0 0 30px}
.form label{display:grid;gap:7px;font-size:13px;margin:13px 0}.form input,.form select,.form textarea{width:100%}
.form label.ck{display:flex;align-items:center;gap:10px}.form label.ck input{width:auto}
.notice{background:#2d261a;color:#e7cd9e;padding:12px;border-radius:8px;font-size:13px;line-height:1.5;margin:14px 0}
.arow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;background:#171821;border-radius:8px;margin:8px 0}
.badge{font-style:normal;font-size:11px;padding:2px 8px;border-radius:99px;background:#292a34;color:#bbb;margin-left:6px}.badge.on{background:#3a1519;color:#ff8c93}
.user{font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.footer{border-top:1px solid var(--line);padding:22px 5%;font-size:12px;color:#888}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}.top{flex-wrap:wrap;gap:10px;padding:10px 4%}nav{order:3;flex-basis:100%;overflow-x:auto}.detail{grid-template-columns:1fr}.detail .poster{max-width:230px}.user{display:none}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.premium{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#inicio"><b>RB</b> FLIX</a>
  <nav id="nav"><a href="#inicio" data-r="inicio">Início</a><a href="#filmes" data-r="filmes">Filmes</a><a href="#series" data-r="series">Séries</a><a href="#lista" data-r="lista">Minha lista</a></nav>
  <div class="row" id="auth"></div>
</header>
<div id="app"></div>
<footer class="footer">© RB FLIX · Somente conteúdos com direitos de distribuição.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script>
var SB_URL="https://uhwxtrooyclybcmstoiu.supabase.co";
var SB_KEY="sb_publishable_6DQCnz5Tl9REjHYnh0mVRw_oNbyg9tK";
var db=window.supabase.createClient(SB_URL,SB_KEY);
var USER=null,ROLE=null,app=document.getElementById("app"),PAGE=20,CS={kind:"",q:"",g:"",p:1},EDIT=null;
var COLS="id,title,kind,year,genre,poster_path";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(id){return document.getElementById(id)}
function posterStyle(t){
  if(t.poster_path)return ' style="background-image:linear-gradient(0deg,#05060c,transparent 75%),url(https://image.tmdb.org/t/p/w500'+esc(t.poster_path)+');background-size:cover;background-position:center"';
  var h=parseInt(String(t.id).slice(0,4),16)%360;
  return ' style="background:linear-gradient(145deg,hsl('+h+' 45% 38%),hsl('+((h+40)%360)+' 35% 12%) 72%)"';
}
function card(t){return '<a class="card" href="#titulo-'+esc(t.id)+'"><div class="poster"'+posterStyle(t)+'><strong>'+esc(t.title)+'</strong></div><p>'+(t.year||"—")+' · '+esc(t.genre||t.kind)+'</p></a>'}
function loginPrompt(title,text){app.innerHTML='<main class="wrap page"><h1>'+title+'</h1><p class="muted">'+text+'</p><a class="btn primary" href="#login">Entrar na conta</a></main>'}

/* ---------- Autenticação ---------- */
async function setUser(session){
  USER=session?session.user:null;ROLE=null;
  if(USER){var p=await db.from("profiles").select("role").eq("id",USER.id).maybeSingle();ROLE=p.data?p.data.role:null}
  renderAuth();
}
function renderAuth(){
  var a=$("auth");
  if(!USER){a.innerHTML='<a class="btn" href="#login">Entrar</a>';return}
  a.innerHTML='<span class="muted user">'+esc(USER.email)+'</span>'+(ROLE==="admin"?'<a class="btn" href="#admin">Admin</a>':'')+'<button class="btn" id="out">Sair</button>';
  $("out").onclick=async function(){await db.auth.signOut();location.hash="#inicio"};
}
db.auth.onAuthStateChange(function(ev,session){
  var novo=session?session.user.id:null,atual=USER?USER.id:null;
  if(novo===atual)return;
  setTimeout(function(){setUser(session).then(route)},0);
});

/* ---------- Telas ---------- */
async function home(){
  app.innerHTML='<section class="hero"><div><h1>Seu próximo filme começa aqui.</h1><p>Explore um catálogo organizado de filmes e séries. A reprodução depende dos direitos de distribuição.</p><div class="row"><a class="btn primary" href="#filmes">Explorar catálogo</a><a class="btn" href="#premium">Conhecer Premium</a></div></div></section><main class="wrap"><section class="section"><h2>Em destaque</h2><div id="hl" class="muted">Carregando…</div></section></main>';
  var r=await db.from("titles").select(COLS).eq("published",true).order("featured",{ascending:false}).order("created_at",{ascending:false}).limit(20);
  var el=$("hl");if(!el)return;
  if(r.error){el.textContent="Não foi possível carregar o catálogo: "+r.error.message;return}
  el.className="";
  el.innerHTML=r.data.length?'<div class="grid">'+r.data.map(card).join("")+'</div>':'<p class="muted">Nenhum título publicado ainda. Entre como admin e publique os primeiros.</p>';
}

async function catalog(kind){
  if(CS.kind!==kind)CS={kind:kind,q:"",g:"",p:1};
  app.innerHTML='<main class="wrap page"><h1>'+(kind==="filme"?"Filmes":"Séries")+'</h1><div class="filters"><input class="field" id="q" type="search" placeholder="Buscar por título" aria-label="Buscar por título"><select class="field" id="g" aria-label="Gênero"><option value="">Todos os gêneros</option></select><button class="btn" id="fb">Filtrar</button></div><div id="res" class="muted">Carregando…</div><div id="pg" class="pager"></div></main>';
  $("q").value=CS.q;
  async function load(){
    var from=(CS.p-1)*PAGE;
    var qy=db.from("titles").select(COLS,{count:"exact"}).eq("published",true).eq("kind",kind).order("title");
    if(CS.g)qy=qy.eq("genre",CS.g);
    if(CS.q)qy=qy.ilike("title","%"+CS.q.replace(/[\\%_]/g,function(m){return"\\"+m})+"%");
    var r=await qy.range(from,from+PAGE-1);
    var res=$("res");if(!res)return;
    if(r.error){res.textContent="Erro ao carregar: "+r.error.message;return}
    res.className="";
    res.innerHTML=r.data.length?'<div class="grid">'+r.data.map(card).join("")+'</div>':'<p class="muted">Nenhum título encontrado. Tente outro nome ou limpe o filtro.</p>';
    var tp=Math.max(1,Math.ceil((r.count||0)/PAGE));
    $("pg").innerHTML=tp>1?'<button class="btn" id="pv"'+(CS.p<=1?' disabled':'')+'>Anterior</button><span class="muted">Página '+CS.p+' de '+tp+'</span><button class="btn" id="nx"'+(CS.p>=tp?' disabled':'')+'>Próxima</button>':'';
    if(tp>1){$("pv").onclick=function(){CS.p--;load()};$("nx").onclick=function(){CS.p++;load()}}
  }
  var g=await db.from("titles").select("genre").eq("published",true).eq("kind",kind).not("genre","is",null);
  var sel=$("g");if(!sel)return;
  if(g.data){
    var set={};g.data.forEach(function(x){if(x.genre)set[x.genre]=1});
    Object.keys(set).sort().forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o)});
    sel.value=CS.g;
  }
  function apply(){CS.q=$("q").value.trim();CS.g=$("g").value;CS.p=1;load()}
  $("fb").onclick=apply;$("q").onkeydown=function(e){if(e.key==="Enter")apply()};
  load();
}

async function detail(id){
  app.innerHTML='<main class="wrap page"><p class="muted">Carregando…</p></main>';
  var r=await db.from("titles").select("*").eq("id",id).maybeSingle();
  if(r.error||!r.data){app.innerHTML='<main class="wrap page"><h1>Título não encontrado</h1><a class="btn primary" href="#inicio">Voltar ao início</a></main>';return}
  var t=r.data,fav=false;
  if(USER){var f=await db.from("favorites").select("title_id").eq("user_id",USER.id).eq("title_id",id).maybeSingle();fav=!!f.data}
  function draw(msg){
    app.innerHTML='<main class="wrap page"><div class="detail"><div class="poster"'+posterStyle(t)+'><strong>'+esc(t.title)+'</strong></div><div><h1>'+esc(t.title)+'</h1><p class="muted">'+(t.kind==="filme"?"Filme":"Série")+' · '+(t.year||"—")+' · '+esc(t.genre||"Gênero não informado")+' · '+esc(t.age_rating||"Classificação não informada")+'</p><p>'+esc(t.overview||"Descrição ainda não cadastrada.")+'</p><div class="row" style="margin:20px 0">'+(USER?'<button class="btn primary" id="fav">'+(fav?"Remover da minha lista":"Adicionar à minha lista")+'</button>':'<a class="btn primary" href="#login">Entre para salvar na lista</a>')+'<a class="btn" href="#'+(t.kind==="filme"?"filmes":"series")+'">Voltar ao catálogo</a></div>'+(msg?'<p class="muted" role="alert">'+msg+'</p>':'')+'<div class="notice">A reprodução será habilitada somente quando houver uma fonte de vídeo devidamente licenciada.</div></div></div></main>';
    var b=$("fav");
    if(b)b.onclick=async function(){
      b.disabled=true;
      var q=fav?await db.from("favorites").delete().eq("user_id",USER.id).eq("title_id",id):await db.from("favorites").insert({user_id:USER.id,title_id:id});
      if(q.error){draw("Não foi possível atualizar sua lista. Tente de novo.");return}
      fav=!fav;draw();
    };
  }
  draw();
}

async function lista(){
  if(!USER){loginPrompt("Minha lista","Entre na sua conta para ver os títulos que você salvou.");return}
  app.innerHTML='<main class="wrap page"><h1>Minha lista</h1><div id="res" class="muted">Carregando…</div></main>';
  var r=await db.from("favorites").select("created_at,titles("+COLS+")").eq("user_id",USER.id).order("created_at",{ascending:false});
  var res=$("res");if(!res)return;
  if(r.error){res.textContent="Erro ao carregar: "+r.error.message;return}
  var items=r.data.map(function(x){return Array.isArray(x.titles)?x.titles[0]:x.titles}).filter(Boolean);
  res.className="";
  res.innerHTML=items.length?'<div class="grid">'+items.map(card).join("")+'</div>':'<p class="muted">Sua lista está vazia. Abra um título e escolha “Adicionar à minha lista”.</p>';
}

function premium(){
  app.innerHTML='<main class="wrap page"><h1>RB FLIX Premium</h1><div class="premium"><div><h2>Em breve</h2><p class="muted" style="margin:0">Valores, cobrança e ativação só serão publicados depois de configurar pagamentos, cancelamento e termos de serviço.</p></div></div><a class="btn" href="#inicio">Voltar ao início</a></main>';
}

function authForm(mode){
  var login=mode==="login";
  app.innerHTML='<main class="wrap"><div class="form"><h1 style="font:800 26px Manrope,sans-serif;margin:0 0 6px">'+(login?"Entrar":"Cadastro")+'</h1><label>E-mail<input id="em" type="email" autocomplete="email"></label><label>Senha'+(login?'':' (mínimo 8 caracteres)')+'<input id="pw" type="password" autocomplete="'+(login?"current-password":"new-password")+'"></label><button class="btn primary" id="go" style="width:100%">'+(login?"Entrar":"Criar conta")+'</button><p class="muted" id="msg" role="status"></p><p class="muted">'+(login?'Ainda não tem conta? <a href="#cadastro" style="text-decoration:underline">Criar cadastro</a>':'Já tem conta? <a href="#login" style="text-decoration:underline">Entrar</a>')+'</p></div></main>';
  $("go").onclick=async function(){
    var e=$("em").value.trim(),p=$("pw").value,m=$("msg"),b=$("go");
    if(!e||!p){m.textContent="Preencha e-mail e senha.";return}
    if(!login&&p.length<8){m.textContent="A senha precisa ter pelo menos 8 caracteres.";return}
    b.disabled=true;m.textContent="";
    var r=login?await db.auth.signInWithPassword({email:e,password:p}):await db.auth.signUp({email:e,password:p});
    b.disabled=false;
    if(r.error){m.textContent=r.error.message;return}
    if(login){location.hash="#inicio"}
    else if(r.data&&r.data.session){location.hash="#inicio"}
    else m.textContent="Cadastro iniciado. Confira seu e-mail para confirmar a conta.";
  };
}

async function admin(){
  if(!USER){loginPrompt("Painel administrativo","Entre com uma conta autorizada para acessar o painel.");return}
  if(ROLE!=="admin"){app.innerHTML='<main class="wrap page"><h1>Acesso não autorizado</h1><p class="muted">Sua conta não tem permissão administrativa.</p><a class="btn" href="#inicio">Voltar</a></main>';return}
  app.innerHTML='<main class="wrap page"><h1>Painel administrativo</h1><p class="muted">Carregando…</p></main>';
  var r=await db.from("titles").select("id,title,kind,year,genre,overview,poster_path,age_rating,featured,published").order("created_at",{ascending:false});
  if(r.error){app.innerHTML='<main class="wrap page"><h1>Painel administrativo</h1><p class="muted">Erro: '+esc(r.error.message)+'</p></main>';return}
  var L=r.data,cur=EDIT?L.filter(function(x){return x.id===EDIT})[0]:null;
  app.innerHTML='<main class="wrap page"><h1>Painel administrativo</h1><div class="notice">Cadastre apenas conteúdos que você tenha autorização para divulgar. Títulos novos começam como rascunho até você publicar.</div>'+
  '<div class="form wide"><h2 style="margin-top:0">'+(cur?"Editar título":"Adicionar título")+'</h2><label>Título<input id="a-t"></label><label>Tipo<select id="a-k"><option value="filme">Filme</option><option value="serie">Série</option></select></label><label>Ano<input id="a-y" type="number"></label><label>Gênero<input id="a-g"></label><label>Classificação indicativa<input id="a-r" placeholder="Ex.: 14"></label><label>Pôster (caminho do TMDB, opcional)<input id="a-pp" placeholder="/abc123.jpg"></label><label>Sinopse<textarea id="a-o" rows="4"></textarea></label><label class="ck"><input type="checkbox" id="a-f"> Destaque na página inicial</label><label class="ck"><input type="checkbox" id="a-p"> Publicado (visível no site)</label><div class="row"><button class="btn primary" id="a-s">'+(cur?"Salvar alterações":"Salvar título")+'</button>'+(cur?'<button class="btn" id="a-c">Cancelar</button>':'')+'</div><p class="muted" id="a-m" role="status"></p></div>'+
  '<h2>Catálogo ('+L.length+')</h2>'+(L.length?'':'<p class="muted">Nenhum título cadastrado ainda.</p>')+
  L.map(function(t){var i=esc(t.id);return '<div class="arow"><span>'+esc(t.title)+' · '+esc(t.kind)+' · '+(t.year||"—")+' <em class="badge'+(t.published?' on':'')+'">'+(t.published?"Publicado":"Rascunho")+'</em>'+(t.featured?'<em class="badge on">Destaque</em>':'')+'</span><span class="row"><button class="btn sm" data-a="e" data-i="'+i+'">Editar</button><button class="btn sm" data-a="p" data-i="'+i+'">'+(t.published?"Despublicar":"Publicar")+'</button><button class="btn sm" data-a="f" data-i="'+i+'">'+(t.featured?"Tirar destaque":"Destacar")+'</button><button class="btn sm" data-a="d" data-i="'+i+'">Excluir</button></span></div>'}).join("")+'</main>';
  var v=cur||{title:"",kind:"filme",year:new Date().getFullYear(),genre:"",age_rating:"",poster_path:"",overview:"",featured:false,published:false};
  $("a-t").value=v.title;$("a-k").value=v.kind;$("a-y").value=v.year||"";$("a-g").value=v.genre||"";$("a-r").value=v.age_rating||"";$("a-pp").value=v.poster_path||"";$("a-o").value=v.overview||"";$("a-f").checked=v.featured;$("a-p").checked=v.published;
  var c=$("a-c");if(c)c.onclick=function(){EDIT=null;admin()};
  $("a-s").onclick=async function(){
    var m=$("a-m"),t=$("a-t").value.trim(),pp=$("a-pp").value.trim();
    if(!t){m.textContent="Informe o título.";return}
    if(pp&&!/^\/[A-Za-z0-9._-]+$/.test(pp)){m.textContent="Pôster inválido. Use só o caminho do TMDB, por exemplo /abc123.jpg.";return}
    var d={title:t,kind:$("a-k").value,year:Number($("a-y").value)||null,genre:$("a-g").value.trim()||null,age_rating:$("a-r").value.trim()||null,poster_path:pp||null,overview:$("a-o").value.trim()||null,featured:$("a-f").checked,published:$("a-p").checked};
    $("a-s").disabled=true;
    var q=EDIT?await db.from("titles").update(d).eq("id",EDIT):await db.from("titles").insert(d);
    if(q.error){$("a-s").disabled=false;m.textContent=q.error.message;return}
    EDIT=null;admin();
  };
  document.querySelectorAll("[data-a]").forEach(function(b){b.onclick=async function(){
    var id=b.dataset.i,a=b.dataset.a,t=L.filter(function(x){return x.id===id})[0],q;
    if(a==="e"){EDIT=id;admin();window.scrollTo(0,0);return}
    if(a==="p")q=await db.from("titles").update({published:!t.published}).eq("id",id);
    if(a==="f")q=await db.from("titles").update({featured:!t.featured}).eq("id",id);
    if(a==="d"){if(!confirm("Excluir “"+t.title+"”? Isso também remove das listas dos usuários."))return;q=await db.from("titles").delete().eq("id",id)}
    if(q&&q.error){$("a-m").textContent=q.error.message;return}
    admin();
  }});
}

/* ---------- Rotas ---------- */
function route(){
  var h=(location.hash||"#inicio").slice(1),m=h.match(/^titulo-([0-9a-f-]{36})$/i);
  if(m)detail(m[1]);
  else if(h==="filmes")catalog("filme");
  else if(h==="series")catalog("serie");
  else if(h==="lista")lista();
  else if(h==="premium")premium();
  else if(h==="login")authForm("login");
  else if(h==="cadastro")authForm("cadastro");
  else if(h==="admin")admin();
  else home();
  document.querySelectorAll("#nav a").forEach(function(a){a.classList.toggle("on",!m&&a.dataset.r===h)});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
db.auth.getSession().then(function(r){return setUser(r.data.session)}).catch(function(){renderAuth()}).then(route);
</script>
